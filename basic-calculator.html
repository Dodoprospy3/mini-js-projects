<!DOCTYPE html>
<html>
    <head>
        <title>Basic Calculator</title>
    </head>

    <body>

        <input class="input1" type="number">

        <div style="margin-bottom: 20px; margin-top: 20px;">

            <label style="border: solid; margin: 12px;"> <input  type="radio" name="operation" value="+"> + </label>
            <label style="border: solid; margin: 12px;"> <input  type="radio" name="operation" value="-"> - </label>
            <label style="border: solid; margin: 12px;"> <input  type="radio" name="operation" value="*"> * </label>
            <label style="border: solid; margin: 12px;"> <input  type="radio" name="operation" value="/"> / </label>

        </div>

        <input class="input2" type="number">

        <div>=</div>

        <output
            style="
                display: block;
                border-style: solid;
                border-width: 1px;
                width: 190px;
                height: 30px;
            "
            class="output"
            ></output>

        <button onclick="
                calculate();
            ">calculate</button> 
        <script>

            const inputElement1 = document.querySelector('.input1');
            const inputElement2 = document.querySelector('.input2');

            function calculate() {

                let input1_VAR = Number(inputElement1.value);
                let input2_VAR = Number(inputElement2.value);
                let operation = document.querySelector('input[name="operation"]:checked');
                let outputElement = document.querySelector('.output');

                if (!operation) {
                    alert('Please select an operation');
                    return;
                }

                if (operation.value === '-') {
                    outputElement.value = input1_VAR - input2_VAR;
                } else if (operation.value === '*') {
                    outputElement.value = input1_VAR * input2_VAR;
                } else if (operation.value === '/') {
                    outputElement.value = input1_VAR / input2_VAR;
                } else {
                    outputElement.value = input1_VAR + input2_VAR;
                }
            }

        </script>
    </body>

</html>
